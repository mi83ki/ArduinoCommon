name: transport-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.7.5 platformio==6.2.0
      - run: uv run --locked pytest -q
      - run: pio test -e native -e native_mqtt -e native_tcp_legacy -e native_transport -e native_tcp_socket
