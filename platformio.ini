[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = true
test_filter = test_wifi_esp32
build_src_filter =
  +<WiFiESP32.cpp>
build_flags =
  -I test/mock
  -std=c++14

[env:native_mqtt]
platform = native
test_framework = unity
test_build_src = true
test_filter = test_mqtt_client_esp32
build_src_filter =
  +<MQTTClientESP32.cpp>
build_flags =
  -I test/mock
  -std=c++14
